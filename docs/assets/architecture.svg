<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="SmartFiles architecture diagram">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17171a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#26262b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="720" height="360" fill="url(#g1)"/>
  <rect width="720" height="360" fill="url(#grid)"/>

  <g font-family="ui-monospace, JetBrains Mono, monospace" font-size="11" fill="#9a9aa3">
    <text x="20" y="24">SmartFiles</text>
  </g>

  <!-- Reader/Writer boxes -->
  <g>
    <rect x="40" y="60" width="160" height="56" rx="8" fill="#111113" stroke="#26262b"/>
    <text x="120" y="84" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e7e7ea" font-weight="600">Writer</text>
    <text x="120" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">numstore write</text>

    <rect x="520" y="60" width="160" height="56" rx="8" fill="#111113" stroke="#26262b"/>
    <text x="600" y="84" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e7e7ea" font-weight="600">Reader</text>
    <text x="600" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">numstore read</text>
  </g>

  <!-- WAL -->
  <g>
    <rect x="40" y="160" width="160" height="76" rx="8" fill="#17171a" stroke="#26262b"/>
    <text x="120" y="184" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e7e7ea" font-weight="600">Write-ahead log</text>
    <text x="120" y="202" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">append-only, fsynced</text>
    <text x="120" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c0391b">000000123.wal</text>
  </g>

  <!-- Chunk store -->
  <g>
    <rect x="260" y="140" width="200" height="116" rx="8" fill="#17171a" stroke="#26262b"/>
    <text x="360" y="164" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e7e7ea" font-weight="600">Chunk store</text>
    <text x="360" y="182" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">content-addressed</text>
    <g fill="#4a6cd9">
      <rect x="282" y="200" width="34" height="34" rx="4" opacity="0.85"/>
      <rect x="324" y="200" width="34" height="34" rx="4" opacity="0.65"/>
      <rect x="366" y="200" width="34" height="34" rx="4" opacity="0.5"/>
      <rect x="408" y="200" width="34" height="34" rx="4" opacity="0.35"/>
    </g>
  </g>

  <!-- Manifest -->
  <g>
    <rect x="520" y="160" width="160" height="76" rx="8" fill="#17171a" stroke="#26262b"/>
    <text x="600" y="184" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#e7e7ea" font-weight="600">Manifest</text>
    <text x="600" y="202" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">columns · retention</text>
    <text x="600" y="220" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#c0391b">manifest@v42</text>
  </g>

  <!-- Connectors -->
  <g stroke="#4a6cd9" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M120 116 L120 160"/>
    <path d="M200 198 L260 198"/>
    <path d="M460 198 L520 198"/>
    <path d="M600 116 L600 160"/>
    <path d="M200 88 Q360 40 520 88"/>
  </g>

  <!-- Labels under arrows -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">
    <text x="130" y="142">append</text>
    <text x="218" y="192">flush</text>
    <text x="468" y="192">scan</text>
    <text x="610" y="142">refresh</text>
    <text x="345" y="40" text-anchor="middle">replication / streaming</text>
  </g>

  <!-- footer line -->
  <g font-family="ui-monospace, monospace" font-size="10" fill="#9a9aa3">
    <text x="40" y="320">mmap path · BLAKE3 verified on read · index every 4096 elements</text>
  </g>
</svg>
